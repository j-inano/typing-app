<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タイピングゲーム</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans JP', sans-serif; background: #0f0f1a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 24px; }
    h1 { color: #e0e0ff; font-size: 1.8rem; text-align: center; }
    .card { background: #1a1a2e; border-radius: 20px; padding: 36px; width: 100%; max-width: 760px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .name-row { display: flex; gap: 10px; margin-bottom: 24px; align-items: center; }
    .name-row label { color: #aaa; font-size: 0.9rem; white-space: nowrap; }
    .name-row input { flex: 1; padding: 10px 14px; background: #0f0f1a; border: 1px solid #333; border-radius: 8px; color: #e0e0ff; font-size: 1rem; }
    .name-row input:focus { outline: none; border-color: #7c6af7; }
    .status-bar { display: flex; gap: 32px; justify-content: center; margin-bottom: 24px; }
    .stat .val { font-size: 2.2rem; font-weight: bold; color: #7c6af7; text-align: center; }
    .stat .lbl { font-size: 0.75rem; color: #888; text-align: center; margin-top: 2px; }
    .text-display { background: #0f0f1a; border-radius: 12px; padding: 20px 32px 24px; font-size: 0.85rem; line-height: 1.8; letter-spacing: 0.08em; margin-bottom: 12px; min-height: 110px; word-break: break-all; }
    .kanji-ref { font-size: 1.45rem; color: #b0b0cc; letter-spacing: 0.1em; margin-bottom: 10px; line-height: 2.6; word-break: break-all; }
    .char-done    { color: #4caf50; }
    .char-current { color: #fff; background: #7c6af7; border-radius: 3px; padding: 0 2px; }
    .char-pending { color: #b0b0cc; }
    .waiting      { color: #555; font-size: 1rem; letter-spacing: 0; }
    .roman-display { background: #0f0f1a; border-radius: 8px; padding: 10px 32px; font-size: 1rem; letter-spacing: 0.1em; margin-bottom: 16px; color: #666; min-height: 36px; word-break: break-all; white-space: normal; }
    .roman-done    { color: #4caf50; }
    .roman-current { color: #fff; font-weight: bold; }
    .roman-pending { color: #444; }
    #typingInput { width: 100%; padding: 14px 18px; background: #0f0f1a; border: 2px solid #333; border-radius: 12px; color: #e0e0ff; font-size: 1.1rem; outline: none; transition: border-color 0.2s; }
    #typingInput:focus { border-color: #7c6af7; }
    #typingInput.error { border-color: #ff4444; background: #1a0f0f; animation: shake 0.15s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    .btn-row { display: flex; gap: 12px; margin-top: 20px; justify-content: center; }
    .btn { padding: 12px 32px; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
    .btn-primary   { background: linear-gradient(135deg, #7c6af7, #5c4de0); color: white; }
    .btn-secondary { background: #2a2a3e; color: #aaa; }
    .btn:hover { opacity: 0.85; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 10; align-items: center; justify-content: center; }
    .overlay.active { display: flex; }
    .result-card { background: #1a1a2e; border-radius: 20px; padding: 40px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
    .result-card h2 { color: #e0e0ff; font-size: 1.5rem; margin-bottom: 16px; }
    .result-score { font-size: 4rem; font-weight: bold; color: #7c6af7; line-height: 1; }
    .result-unit  { color: #888; font-size: 0.9rem; margin-bottom: 6px; }
    .result-sub   { color: #aaa; font-size: 1rem; margin-bottom: 28px; }
    .result-card .btn-row { margin-top: 0; }
    .tago-img { width: 120px; height: 120px; object-fit: contain; margin-bottom: 12px; animation: tago-bounce 0.6s ease infinite alternate; }
    @keyframes tago-bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
    .ranking-card { background: #1a1a2e; border-radius: 20px; padding: 28px 36px; width: 100%; max-width: 760px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .ranking-card h2 { color: #e0e0ff; font-size: 1.2rem; margin-bottom: 18px; text-align: center; }
    table { width: 100%; border-collapse: collapse; }
    thead th { color: #666; font-size: 0.78rem; padding: 8px 12px; text-align: left; border-bottom: 1px solid #2a2a3e; }
    tbody td { color: #ccc; padding: 12px 12px; font-size: 0.95rem; border-bottom: 1px solid #1e1e2e; }
    .rank-medal { font-size: 1.1rem; }
    .score-val { color: #7c6af7; font-weight: bold; }
    .empty-rank { text-align: center; color: #444; padding: 20px; font-size: 0.9rem; }
  </style>
</head>
<body>

<h1>&#9000; タイピングゲーム</h1>

<div class="card">
  <div class="name-row">
    <label>プレイヤー名：</label>
    <input type="text" id="nameInput" placeholder="名前を入力してください" maxlength="20">
  </div>
  <div class="status-bar">
    <div class="stat"><div class="val" id="scoreVal">0</div><div class="lbl">スコア（文字数）</div></div>
    <div class="stat"><div class="val" id="timerVal">0.0</div><div class="lbl">経過時間（秒）</div></div>
  </div>
  <div class="text-display" id="textDisplay">
    <span class="waiting">名前を入力して「スタート」を押してください</span>
  </div>
  <div class="roman-display" id="romanDisplay"></div>
  <input type="text" id="typingInput" placeholder="ローマ字で入力（IMEをオフ）" disabled autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="en">
  <div class="btn-row">
    <button class="btn btn-primary" id="startBtn" onclick="startGame()">スタート</button>
  </div>
</div>

<div class="ranking-card">
  <h2>&#127942; ランキング TOP5</h2>
  <table>
    <thead><tr><th>順位</th><th>名前</th><th>スコア</th><th>時間</th><th>日時</th></tr></thead>
    <tbody id="rankingBody"><tr><td colspan="5" class="empty-rank">読み込み中...</td></tr></tbody>
  </table>
</div>

<div class="overlay" id="resultOverlay">
  <div class="result-card">
    <img src="/static/images/tago.png" alt="たご" class="tago-img" id="tagoImg">
    <h2 id="resultTitle">ゲームオーバー</h2>
    <div class="result-unit">スコア（正確に入力したひらがな文字数）</div>
    <div class="result-score" id="resultScore">0</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="closeResult(); startGame()">もう一度</button>
      <button class="btn btn-secondary" onclick="closeResult()">閉じる</button>
    </div>
  </div>
</div>

<script>
// ---- ひらがな1文字に対する入力可能ローマ字パターン ----
const KANA_MAP = {
  'a':'a','i':'i','u':'u','e':'e','o':'o',
  'ka':'ka','ki':'ki','ku':'ku','ke':'ke','ko':'ko',
  'ga':'ga','gi':'gi','gu':'gu','ge':'ge','go':'go',
  'sa':'sa','si':['si','shi'],'su':'su','se':'se','so':'so',
  'za':'za','zi':['zi','ji'],'zu':'zu','ze':'ze','zo':'zo',
  'ta':'ta','ti':['ti','chi'],'tu':['tu','tsu'],'te':'te','to':'to',
  'da':'da','di':'di','du':'du','de':'de','do':'do',
  'na':'na','ni':'ni','nu':'nu','ne':'ne','no':'no',
  'ha':'ha','hi':'hi','hu':['hu','fu'],'he':'he','ho':'ho',
  'ba':'ba','bi':'bi','bu':'bu','be':'be','bo':'bo',
  'pa':'pa','pi':'pi','pu':'pu','pe':'pe','po':'po',
  'ma':'ma','mi':'mi','mu':'mu','me':'me','mo':'mo',
  'ya':'ya','yu':'yu','yo':'yo',
  'ra':'ra','ri':'ri','ru':'ru','re':'re','so':'so','ro':'ro',
  'wa':'wa','wo':'wo',
  'n':'nn',
  'kya':'kya','kyu':'kyu','kyo':'kyo',
  'sha':['sha','sya'],'shi':['shi','si'],'shu':['shu','syu'],'sho':['sho','syo'],
  'chi':['chi','ti'],'cha':['cha','tya'],'chu':['chu','tyu'],'cho':['cho','tyo'],
  'tsu':['tsu','tu'],
  'nya':'nya','nyu':'nyu','nyo':'nyo',
  'hya':'hya','hyu':'hyu','hyo':'hyo',
  'mya':'mya','myu':'myu','myo':'myo',
  'rya':'rya','ryu':'ryu','ryo':'ryo',
  'gya':'gya','gyu':'gyu','gyo':'gyo',
  'ja':['ja','zya','jya'],'ji':['ji','zi'],'ju':['ju','zyu','jyu'],'jo':['jo','zyo','jyo'],
  'bya':'bya','byu':'byu','byo':'byo',
  'pya':'pya','pyu':'pyu','pyo':'pyo',
  'xtu':['xtu','ltu'],
  '-':'-','~':'~',
  '.':'.', ',':',','!':'!','?':'?',' ':' ',
};

// ひらがな文字列をトークン（入力単位）に分解
// 例: "きそじ" -> ["き","そ","じ"]
// 例: "しゃ" -> ["しゃ"]
// 例: "っき" -> ["っき"] (促音+次の文字をセットで)
const COMPOUND = ['ゃ','ゅ','ょ','ぁ','ぃ','ぅ','ぇ','ぉ'];

function tokenize(ruby) {
  const tokens = [];
  let i = 0;
  while (i < ruby.length) {
    const ch = ruby[i];
    // 促音（っ）は次の文字とセット
    if (ch === 'っ' && i + 1 < ruby.length) {
      const next = ruby[i+1];
      // 次が拗音の場合はさらに1文字先も見る
      if (i + 2 < ruby.length && COMPOUND.includes(ruby[i+2])) {
        tokens.push({ type: 'soku', base: next + ruby[i+2] });
        i += 3;
      } else {
        tokens.push({ type: 'soku', base: next });
        i += 2;
      }
    } else if (i + 1 < ruby.length && COMPOUND.includes(ruby[i+1])) {
      // 拗音（きゃ等）
      tokens.push({ type: 'kana', kana: ch + ruby[i+1] });
      i += 2;
    } else {
      tokens.push({ type: 'kana', kana: ch });
      i++;
    }
  }
  return tokens;
}

// トークンに対する入力候補リストを返す（子音重ねを先頭に）
function getCandidates(token) {
  if (token.type === 'soku') {
    const baseCands = getRomanList(token.base);
    const consonants = [];
    const extras = ['xtu','ltu'];
    for (const r of baseCands) {
      if (r[0] && !'aiueo'.includes(r[0])) {
        consonants.push(r[0] + r); // 子音重ね（ppou等）を先頭に
      }
    }
    return [...consonants, ...extras];
  }
  return getRomanList(token.kana);
}

// ひらがな（1〜2文字）に対するローマ字候補リストを返す
function getRomanList(kana) {
  if (!kana) return [kana];
  // カタカナをひらがなに変換
  const hira = kana.replace(/[\u30A1-\u30F6]/g, c =>
    String.fromCharCode(c.charCodeAt(0) - 0x60));
  // 句読点・記号
  const punctMap = {'。':'.','、':',','！':'!','？':'?','ー':'-','　':' '};
  if (punctMap[hira]) return [punctMap[hira]];
  // ひらがな→ローマ字マッピング
  const HIRA_TO_ROMAN = {
    'あ':['a'],'い':['i'],'う':['u'],'え':['e'],'お':['o'],
    'か':['ka'],'き':['ki'],'く':['ku'],'け':['ke'],'こ':['ko'],
    'が':['ga'],'ぎ':['gi'],'ぐ':['gu'],'げ':['ge'],'ご':['go'],
    'さ':['sa'],'し':['si','shi'],'す':['su'],'せ':['se'],'そ':['so'],
    'ざ':['za'],'じ':['zi','ji'],'ず':['zu'],'ぜ':['ze'],'ぞ':['zo'],
    'た':['ta'],'ち':['ti','chi'],'つ':['tu','tsu'],'て':['te'],'と':['to'],
    'だ':['da'],'ぢ':['di'],'づ':['du'],'で':['de'],'ど':['do'],
    'な':['na'],'に':['ni'],'ぬ':['nu'],'ね':['ne'],'の':['no'],
    'は':['ha'],'ひ':['hi'],'ふ':['hu','fu'],'へ':['he'],'ほ':['ho'],
    'ば':['ba'],'び':['bi'],'ぶ':['bu'],'べ':['be'],'ぼ':['bo'],
    'ぱ':['pa'],'ぴ':['pi'],'ぷ':['pu'],'ぺ':['pe'],'ぽ':['po'],
    'ま':['ma'],'み':['mi'],'む':['mu'],'め':['me'],'も':['mo'],
    'や':['ya'],'ゆ':['yu'],'よ':['yo'],
    'ら':['ra'],'り':['ri'],'る':['ru'],'れ':['re'],'ろ':['ro'],
    'わ':['wa'],'を':['wo'],'ん':['nn'],
    'きゃ':['kya'],'きゅ':['kyu'],'きょ':['kyo'],
    'しゃ':['sha','sya'],'しゅ':['shu','syu'],'しょ':['sho','syo'],
    'ちゃ':['cha','tya'],'ちゅ':['chu','tyu'],'ちょ':['cho','tyo'],
    'にゃ':['nya'],'にゅ':['nyu'],'にょ':['nyo'],
    'ひゃ':['hya'],'ひゅ':['hyu'],'ひょ':['hyo'],
    'みゃ':['mya'],'みゅ':['myu'],'みょ':['myo'],
    'りゃ':['rya'],'りゅ':['ryu'],'りょ':['ryo'],
    'ぎゃ':['gya'],'ぎゅ':['gyu'],'ぎょ':['gyo'],
    'じゃ':['ja','zya','jya'],'じゅ':['ju','zyu','jyu'],'じょ':['jo','zyo','jyo'],
    'びゃ':['bya'],'びゅ':['byu'],'びょ':['byo'],
    'ぴゃ':['pya'],'ぴゅ':['pyu'],'ぴょ':['pyo'],
  };
  return HIRA_TO_ROMAN[hira] || [hira];
}

// ---- ゲーム状態 ----
let targetText = '';
let targetRuby = '';
let tokens = [];
let tokenIndex = 0;
let candidates = [];  // 現在トークンの入力候補
let buf = '';         // 現在トークンへの入力バッファ
let totalScore = 0;
let startTime = null;
let timerInterval = null;
let gameActive = false;

const textDisplay  = document.getElementById('textDisplay');
const romanDisplay = document.getElementById('romanDisplay');
const typingInput  = document.getElementById('typingInput');
const scoreVal     = document.getElementById('scoreVal');
const timerVal     = document.getElementById('timerVal');
const startBtn     = document.getElementById('startBtn');
const nameInput    = document.getElementById('nameInput');

function initText(data) {
  targetText = data.text;
  targetRuby = data.ruby || data.text;
  tokens = tokenize(targetRuby);
  tokenIndex = 0;
  buf = '';
  candidates = getCandidates(tokens[0]);
}

// ---- ランキング ----
async function loadRanking() {
  const res = await fetch('/api/ranking');
  const data = await res.json();
  const medals = ['\u{1F947}','\u{1F948}','\u{1F949}','4','5'];
  const tbody = document.getElementById('rankingBody');
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-rank">まだ記録がありません</td></tr>';
    return;
  }
  tbody.innerHTML = data.map((s,i) => `
    <tr>
      <td><span class="rank-medal">${medals[i]}</span></td>
      <td>${escHtml(s.username)}</td>
      <td><span class="score-val">${s.score}</span> 文字</td>
      <td>${s.elapsed.toFixed(1)} 秒</td>
      <td>${s.created_at}</td>
    </tr>
  `).join('');
}
loadRanking();

// ---- ゲーム開始 ----
async function startGame() {
  const name = nameInput.value.trim();
  if (!name) {
    nameInput.focus();
    nameInput.style.borderColor = '#ff4444';
    setTimeout(() => nameInput.style.borderColor = '', 1000);
    return;
  }
  const res = await fetch('/api/text');
  initText(await res.json());
  totalScore = 0;
  startTime = null;
  gameActive = true;
  scoreVal.textContent = '0';
  timerVal.textContent = '0.0';
  clearInterval(timerInterval);
  renderText();
  renderRoman();
  typingInput.value = '';
  typingInput.disabled = false;
  typingInput.classList.remove('error');
  typingInput.focus();
  startBtn.textContent = 'リセット';
}

// ---- 次の文 ----
async function loadNextText() {
  totalScore += tokens.length;
  scoreVal.textContent = totalScore;
  const res = await fetch('/api/text');
  initText(await res.json());
  renderText();
  renderRoman();
  typingInput.value = '';
  typingInput.focus();
}

// ---- キー入力 ----
let justComposed = false;  // 日本語変換直後フラグ
typingInput.addEventListener('compositionend', () => {
  justComposed = true;
  // 変換確定直後の短い間（200ms）はキー入力を無視する
  setTimeout(() => { justComposed = false; }, 200);
});

typingInput.addEventListener('keydown', (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  if (justComposed) return;  // 変換確定直後のキー（スペース等）を無視
  if (e.repeat) return;  // キーリピート（長押し）を無視
  if (!gameActive) return;
  if (e.key === ' ') return;  // スペースキーは無視
  if (e.key.length !== 1) return;
  e.preventDefault();

  if (!startTime) {
    startTime = Date.now();
    timerInterval = setInterval(() => {
      timerVal.textContent = ((Date.now() - startTime) / 1000).toFixed(1);
    }, 100);
  }

  const key = e.key.toLowerCase();
  const newBuf = buf + key;

  // 候補と照合
  const exact = candidates.filter(c => c === newBuf);
  const partial = candidates.filter(c => c.startsWith(newBuf) && c !== newBuf);

  if (exact.length > 0) {
    // トークン確定
    typingInput.classList.remove('error');
    tokenIndex++;
    buf = '';
    scoreVal.textContent = totalScore + tokenIndex;
    if (tokenIndex >= tokens.length) {
      loadNextText();
    } else {
      candidates = getCandidates(tokens[tokenIndex]);
      renderText();
      renderRoman();
    }
  } else if (partial.length > 0) {
    // 途中まで合っている
    typingInput.classList.remove('error');
    buf = newBuf;
    candidates = partial;
    renderRoman();
  } else {
    // ミス
    typingInput.classList.add('error');
    setTimeout(() => endGame(), 250);
  }
});

typingInput.addEventListener('input', () => { typingInput.value = ''; });

// ---- ゲーム終了 ----
async function endGame() {
  if (!gameActive) return;
  gameActive = false;
  clearInterval(timerInterval);
  typingInput.disabled = true;
  const elapsed = startTime ? (Date.now() - startTime) / 1000 : 0;
  const score = totalScore + tokenIndex;
  const username = nameInput.value.trim() || '名無し';
  await fetch('/api/score', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, score, elapsed })
  });
  document.getElementById('resultTitle').textContent = '💥 ミス！';
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultSub').textContent = `${elapsed.toFixed(1)}秒経過`;
  document.getElementById('resultOverlay').classList.add('active');
  startBtn.textContent = 'スタート';
  loadRanking();
}

function closeResult() {
  document.getElementById('resultOverlay').classList.remove('active');
}

// ---- テキスト描画 ----
function renderText() {
  // 上段: ひらがなをトークン単位で色分け（メイン）
  let rubyPos = 0;
  const tokenPositions = tokens.map(t => {
    const start = rubyPos;
    if (t.type === 'soku') {
      rubyPos += 1 + t.base.length;
    } else {
      rubyPos += t.kana.length;
    }
    return { start, end: rubyPos };
  });

  let rubyHtml = '';
  for (let i = 0; i < targetRuby.length; i++) {
    const ch = escHtml(targetRuby[i]);
    const tIdx = tokenPositions.findIndex(p => i >= p.start && i < p.end);
    if (tIdx < tokenIndex) {
      rubyHtml += `<span class="char-done">${ch}</span>`;
    } else if (tIdx === tokenIndex) {
      rubyHtml += `<span class="char-current">${ch}</span>`;
    } else {
      rubyHtml += `<span class="char-pending">${ch}</span>`;
    }
  }

  // 下段: 漢字テキストを薄く参考表示
  const kanjiHtml = `<div class="kanji-ref">${escHtml(targetText)}</div>`;

  textDisplay.innerHTML = rubyHtml + kanjiHtml;
}

// ---- ローマ字進捗描画（前後20文字だけ表示） ----
function renderRoman() {
  let doneStr = '';
  for (let i = 0; i < tokenIndex; i++) {
    doneStr += getCandidates(tokens[i])[0];
  }
  const currentDone = buf;
  const currentRest = candidates[0] ? candidates[0].slice(buf.length) : '';
  let pendingStr = '';
  for (let i = tokenIndex + 1; i < tokens.length; i++) {
    pendingStr += getCandidates(tokens[i])[0];
  }

  // 前後20文字に絞る
  const fullDone = doneStr + currentDone;
  const trimDone = fullDone.slice(-20);
  const trimPending = (currentRest.slice(1) + pendingStr).slice(0, 20);

  romanDisplay.innerHTML =
    `<span class="roman-done">${escHtml(trimDone)}</span>` +
    `<span class="roman-current">${escHtml(currentRest[0] || '')}</span>` +
    `<span class="roman-pending">${escHtml(trimPending)}</span>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
