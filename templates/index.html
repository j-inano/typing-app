<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タイピングゲーム</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans JP', sans-serif; background: #0f0f1a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 24px; }
    h1 { color: #e0e0ff; font-size: 1.8rem; text-align: center; }
    .card { background: #1a1a2e; border-radius: 20px; padding: 36px; width: 100%; max-width: 760px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .name-row { display: flex; gap: 10px; margin-bottom: 24px; align-items: center; }
    .name-row label { color: #aaa; font-size: 0.9rem; white-space: nowrap; }
    .name-row input { flex: 1; padding: 10px 14px; background: #0f0f1a; border: 1px solid #333; border-radius: 8px; color: #e0e0ff; font-size: 1rem; }
    .name-row input:focus { outline: none; border-color: #7c6af7; }
    .status-bar { display: flex; gap: 32px; justify-content: center; margin-bottom: 24px; }
    .stat .val { font-size: 2.2rem; font-weight: bold; color: #7c6af7; text-align: center; }
    .stat .lbl { font-size: 0.75rem; color: #888; text-align: center; margin-top: 2px; }
    .text-display { background: #0f0f1a; border-radius: 12px; padding: 28px 32px; font-size: 1.45rem; line-height: 2.6; letter-spacing: 0.1em; margin-bottom: 12px; min-height: 110px; word-break: break-all; }
    .char-done    { color: #4caf50; }
    .char-current { color: #fff; background: #7c6af7; border-radius: 3px; padding: 0 2px; }
    .char-pending { color: #b0b0cc; }
    .waiting      { color: #555; font-size: 1rem; letter-spacing: 0; }
    .roman-display { background: #0f0f1a; border-radius: 8px; padding: 10px 32px; font-size: 1rem; letter-spacing: 0.1em; margin-bottom: 16px; color: #666; min-height: 36px; word-break: break-all; white-space: normal; }
    .roman-done    { color: #4caf50; }
    .roman-current { color: #fff; font-weight: bold; }
    .roman-pending { color: #444; }
    #typingInput { width: 100%; padding: 14px 18px; background: #0f0f1a; border: 2px solid #333; border-radius: 12px; color: #e0e0ff; font-size: 1.1rem; outline: none; transition: border-color 0.2s; ime-mode: disabled; }
    #typingInput:focus { border-color: #7c6af7; }
    #typingInput.error { border-color: #ff4444; background: #1a0f0f; animation: shake 0.15s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    .btn-row { display: flex; gap: 12px; margin-top: 20px; justify-content: center; }
    .btn { padding: 12px 32px; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
    .btn-primary   { background: linear-gradient(135deg, #7c6af7, #5c4de0); color: white; }
    .btn-secondary { background: #2a2a3e; color: #aaa; }
    .btn:hover { opacity: 0.85; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 10; align-items: center; justify-content: center; }
    .overlay.active { display: flex; }
    .result-card { background: #1a1a2e; border-radius: 20px; padding: 40px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
    .result-card h2 { color: #e0e0ff; font-size: 1.5rem; margin-bottom: 16px; }
    .result-score { font-size: 4rem; font-weight: bold; color: #7c6af7; line-height: 1; }
    .result-unit  { color: #888; font-size: 0.9rem; margin-bottom: 6px; }
    .result-sub   { color: #aaa; font-size: 1rem; margin-bottom: 28px; }
    .result-card .btn-row { margin-top: 0; }
    .ranking-card { background: #1a1a2e; border-radius: 20px; padding: 28px 36px; width: 100%; max-width: 760px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .ranking-card h2 { color: #e0e0ff; font-size: 1.2rem; margin-bottom: 18px; text-align: center; }
    table { width: 100%; border-collapse: collapse; }
    thead th { color: #666; font-size: 0.78rem; padding: 8px 12px; text-align: left; border-bottom: 1px solid #2a2a3e; }
    tbody td { color: #ccc; padding: 12px 12px; font-size: 0.95rem; border-bottom: 1px solid #1e1e2e; }
    .rank-medal { font-size: 1.1rem; }
    .score-val { color: #7c6af7; font-weight: bold; }
    .empty-rank { text-align: center; color: #444; padding: 20px; font-size: 0.9rem; }
  </style>
</head>
<body>

<h1>&#9000; タイピングゲーム</h1>

<div class="card">
  <div class="name-row">
    <label>プレイヤー名：</label>
    <input type="text" id="nameInput" placeholder="名前を入力してください" maxlength="20">
  </div>
  <div class="status-bar">
    <div class="stat"><div class="val" id="scoreVal">0</div><div class="lbl">スコア（文字数）</div></div>
    <div class="stat"><div class="val" id="timerVal">0.0</div><div class="lbl">経過時間（秒）</div></div>
  </div>
  <div class="text-display" id="textDisplay">
    <span class="waiting">名前を入力して「スタート」を押してください</span>
  </div>
  <div class="roman-display" id="romanDisplay"></div>
  <input type="text" id="typingInput" placeholder="ローマ字で入力（IMEをオフにしてください）" disabled autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="en">
  <div class="btn-row">
    <button class="btn btn-primary" id="startBtn" onclick="startGame()">スタート</button>
  </div>
</div>

<div class="ranking-card">
  <h2>&#127942; ランキング TOP5</h2>
  <table>
    <thead><tr><th>順位</th><th>名前</th><th>スコア</th><th>時間</th><th>日時</th></tr></thead>
    <tbody id="rankingBody"><tr><td colspan="5" class="empty-rank">読み込み中...</td></tr></tbody>
  </table>
</div>

<div class="overlay" id="resultOverlay">
  <div class="result-card">
    <h2 id="resultTitle">ゲームオーバー</h2>
    <div class="result-unit">スコア（正確に入力したひらがな文字数）</div>
    <div class="result-score" id="resultScore">0</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="closeResult(); startGame()">もう一度</button>
      <button class="btn btn-secondary" onclick="closeResult()">閉じる</button>
    </div>
  </div>
</div>

<script>
  // ---- ローマ字→ひらがな変換テーブル ----
  // 長いものを先に並べる（優先マッチのため）
  const ROMAN_TABLE = [
    ['chi','ち'],['tchi','っち'],['cchi','っち'],
    ['tsu','つ'],['ttsu','っつ'],
    ['sha','しゃ'],['shi','し'],['shu','しゅ'],['she','しぇ'],['sho','しょ'],
    ['tya','ちゃ'],['tyi','ちぃ'],['tyu','ちゅ'],['tye','ちぇ'],['tyo','ちょ'],
    ['cha','ちゃ'],['chu','ちゅ'],['che','ちぇ'],['cho','ちょ'],
    ['nya','にゃ'],['nyi','にぃ'],['nyu','にゅ'],['nye','にぇ'],['nyo','にょ'],
    ['mya','みゃ'],['myi','みぃ'],['myu','みゅ'],['mye','みぇ'],['myo','みょ'],
    ['rya','りゃ'],['ryi','りぃ'],['ryu','りゅ'],['rye','りぇ'],['ryo','りょ'],
    ['hya','ひゃ'],['hyi','ひぃ'],['hyu','ひゅ'],['hye','ひぇ'],['hyo','ひょ'],
    ['kya','きゃ'],['kyi','きぃ'],['kyu','きゅ'],['kye','きぇ'],['kyo','きょ'],
    ['gya','ぎゃ'],['gyi','ぎぃ'],['gyu','ぎゅ'],['gye','ぎぇ'],['gyo','ぎょ'],
    ['bya','びゃ'],['byi','びぃ'],['byu','びゅ'],['bye','びぇ'],['byo','びょ'],
    ['pya','ぴゃ'],['pyi','ぴぃ'],['pyu','ぴゅ'],['pye','ぴぇ'],['pyo','ぴょ'],
    ['dya','ぢゃ'],['dyu','ぢゅ'],['dyo','ぢょ'],
    ['ja','じゃ'],['ji','じ'],['ju','じゅ'],['je','じぇ'],['jo','じょ'],
    ['jya','じゃ'],['jyu','じゅ'],['jyo','じょ'],
    ['fa','ふぁ'],['fi','ふぃ'],['fu','ふ'],['fe','ふぇ'],['fo','ふぉ'],
    ['dha','でゃ'],['dhi','でぃ'],['dhu','でゅ'],['dhe','でぇ'],['dho','でょ'],
    ['tha','てゃ'],['thi','てぃ'],['thu','てゅ'],['the','てぇ'],['tho','てょ'],
    ['xtu','っ'],['xtsu','っ'],['ltu','っ'],['ltsu','っ'],
    ['xa','ぁ'],['xi','ぃ'],['xu','ぅ'],['xe','ぇ'],['xo','ぉ'],
    ['la','ぁ'],['li','ぃ'],['lu','ぅ'],['le','ぇ'],['lo','ぉ'],
    ['xya','ゃ'],['xyu','ゅ'],['xyo','ょ'],
    ['lya','ゃ'],['lyu','ゅ'],['lyo','ょ'],
    ['wa','わ'],['wi','ゐ'],['we','ゑ'],['wo','を'],
    ['nn','ん'],['n\'','ん'],
    ['ka','か'],['ki','き'],['ku','く'],['ke','け'],['ko','こ'],
    ['ga','が'],['gi','ぎ'],['gu','ぐ'],['ge','げ'],['go','ご'],
    ['sa','さ'],['si','し'],['su','す'],['se','せ'],['so','そ'],
    ['za','ざ'],['zi','じ'],['zu','ず'],['ze','ぜ'],['zo','ぞ'],
    ['ta','た'],['ti','ち'],['tu','つ'],['te','て'],['to','と'],
    ['da','だ'],['di','ぢ'],['du','づ'],['de','で'],['do','ど'],
    ['na','な'],['ni','に'],['nu','ぬ'],['ne','ね'],['no','の'],
    ['ha','は'],['hi','ひ'],['hu','ふ'],['he','へ'],['ho','ほ'],
    ['ba','ば'],['bi','び'],['bu','ぶ'],['be','べ'],['bo','ぼ'],
    ['pa','ぱ'],['pi','ぴ'],['pu','ぷ'],['pe','ぺ'],['po','ぽ'],
    ['ma','ま'],['mi','み'],['mu','む'],['me','め'],['mo','も'],
    ['ya','や'],['yu','ゆ'],['yo','よ'],
    ['ra','ら'],['ri','り'],['ru','る'],['re','れ'],['ro','ろ'],
    ['a','あ'],['i','い'],['u','う'],['e','え'],['o','お'],
    ['n','ん'],
    ['-','ー'],['~','〜'],
    ['.','。'],[',','、'],['!','！'],['?','？'],
    [' ','　'],
  ];

  // ひらがな文字列をローマ字候補に変換（最短ローマ字）
  function hiraganaToRoman(hira) {
    let result = '';
    let i = 0;
    while (i < hira.length) {
      let matched = false;
      for (const [roman, kana] of ROMAN_TABLE) {
        if (hira.startsWith(kana, i)) {
          result += roman;
          i += kana.length;
          matched = true;
          break;
        }
      }
      if (!matched) {
        result += hira[i];
        i++;
      }
    }
    return result;
  }

  // ---- ゲーム状態 ----
  let targetText = '';
  let targetRuby = '';
  let romanTarget = '';
  let romanIndex = 0;
  let hiraganaIndex = 0;
  let totalScore = 0;    // 累計スコア（複数文にまたがる）
  let startTime = null;
  let timerInterval = null;
  let gameActive = false;

  const textDisplay  = document.getElementById('textDisplay');
  const romanDisplay = document.getElementById('romanDisplay');
  const typingInput  = document.getElementById('typingInput');
  const scoreVal     = document.getElementById('scoreVal');
  const timerVal     = document.getElementById('timerVal');
  const startBtn     = document.getElementById('startBtn');
  const nameInput    = document.getElementById('nameInput');

  // ---- ランキング ----
  async function loadRanking() {
    const res = await fetch('/api/ranking');
    const data = await res.json();
    const medals = ['\u{1F947}','\u{1F948}','\u{1F949}','4','5'];
    const tbody = document.getElementById('rankingBody');
    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-rank">まだ記録がありません</td></tr>';
      return;
    }
    tbody.innerHTML = data.map((s,i) => `
      <tr>
        <td><span class="rank-medal">${medals[i]}</span></td>
        <td>${escHtml(s.username)}</td>
        <td><span class="score-val">${s.score}</span> 文字</td>
        <td>${s.elapsed.toFixed(1)} 秒</td>
        <td>${s.created_at}</td>
      </tr>
    `).join('');
  }
  loadRanking();

  // ---- ゲーム開始 ----
  async function startGame() {
    const name = nameInput.value.trim();
    if (!name) {
      nameInput.focus();
      nameInput.style.borderColor = '#ff4444';
      setTimeout(() => nameInput.style.borderColor = '', 1000);
      return;
    }
    const res = await fetch('/api/text');
    const data = await res.json();
    targetText = data.text;
    targetRuby = data.ruby || data.text;
    romanTarget = hiraganaToRoman(targetRuby);
    romanIndex = 0;
    hiraganaIndex = 0;
    totalScore = 0;
    startTime = null;
    gameActive = true;
    scoreVal.textContent = '0';
    timerVal.textContent = '0.0';
    clearInterval(timerInterval);
    renderText();
    renderRoman();
    typingInput.value = '';
    typingInput.disabled = false;
    typingInput.classList.remove('error');
    typingInput.focus();
    startBtn.textContent = 'リセット';
  }

  // ローマ字インデックスから対応するひらがなインデックスを正確に計算
  function romanToHiraganaIndex(rIdx) {
    let ri = 0;
    let hi = 0;
    while (hi < targetRuby.length && ri < rIdx) {
      let matched = false;
      for (const [roman, kana] of ROMAN_TABLE) {
        if (targetRuby.startsWith(kana, hi) && romanTarget.startsWith(roman, ri)) {
          if (ri + roman.length <= rIdx) {
            ri += roman.length;
            hi += kana.length;
            matched = true;
            break;
          } else {
            // ローマ字の途中（例: 'k'だけ入力してまだ'a'待ち）
            return hi;
          }
        }
      }
      if (!matched) break;
    }
    return hi;
  }

  // ---- 次の文を読み込む ----
  async function loadNextText() {
    totalScore += targetRuby.length;
    scoreVal.textContent = totalScore;
    const res = await fetch('/api/text');
    const data = await res.json();
    targetText = data.text;
    targetRuby = data.ruby || data.text;
    romanTarget = hiraganaToRoman(targetRuby);
    romanIndex = 0;
    hiraganaIndex = 0;
    renderText();
    renderRoman();
    typingInput.value = '';
    typingInput.focus();
  }

  typingInput.addEventListener('keydown', (e) => {
    // IMEが介入しているキーは無視
    if (e.isComposing || e.keyCode === 229) return;
    if (!gameActive) return;
    if (e.key.length !== 1) return; // 特殊キーは無視
    e.preventDefault();

    if (!startTime) {
      startTime = Date.now();
      timerInterval = setInterval(() => {
        timerVal.textContent = ((Date.now() - startTime) / 1000).toFixed(1);
      }, 100);
    }

    const typed = e.key.toLowerCase();
    const expected = romanTarget[romanIndex];

    if (typed === expected) {
      typingInput.classList.remove('error');
      romanIndex++;

      // ひらがなの進捗を正確に計算
      hiraganaIndex = romanToHiraganaIndex(romanIndex);
      scoreVal.textContent = hiraganaIndex;
      renderText();
      renderRoman();

      if (romanIndex >= romanTarget.length) {
        // 1文クリア → 次の文へ
        loadNextText();
      }
    } else {
      typingInput.classList.add('error');
      setTimeout(() => endGame(false), 250);
    }
  });

  // inputイベントはすべて無効化（IME入力を防ぐ）
  typingInput.addEventListener('input', (e) => {
    typingInput.value = '';
  });

  // ---- ゲーム終了 ----
  async function endGame(cleared) {
    if (!gameActive) return;
    gameActive = false;
    clearInterval(timerInterval);
    typingInput.disabled = true;
    const elapsed = startTime ? (Date.now() - startTime) / 1000 : 0;
    const score = totalScore + hiraganaIndex;
    const username = nameInput.value.trim() || '名無し';
    await fetch('/api/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, score, elapsed })
    });
    document.getElementById('resultTitle').textContent = cleared ? '🎉 クリア！' : '💥 ミス！';
    document.getElementById('resultScore').textContent = score;
    document.getElementById('resultSub').textContent = cleared
      ? `全文入力完了！ ${elapsed.toFixed(1)}秒`
      : `${elapsed.toFixed(1)}秒経過`;
    document.getElementById('resultOverlay').classList.add('active');
    startBtn.textContent = 'スタート';
    loadRanking();
  }

  function closeResult() {
    document.getElementById('resultOverlay').classList.remove('active');
  }

  // ---- テキスト描画 ----
  function renderText() {
    // ひらがなインデックスからテキスト上の位置を計算
    // targetRubyとtargetTextは文字数が異なるので進捗率で対応
    const hiProgress = hiraganaIndex / (targetRuby.length || 1);
    const doneChars = Math.floor(targetText.length * hiProgress);
    let html = '';
    for (let i = 0; i < targetText.length; i++) {
      const ch = escHtml(targetText[i]);
      if (i < doneChars)        html += `<span class="char-done">${ch}</span>`;
      else if (i === doneChars) html += `<span class="char-current">${ch}</span>`;
      else                      html += `<span class="char-pending">${ch}</span>`;
    }
    textDisplay.innerHTML = html;
  }

  // ---- ローマ字進捗描画 ----
  function renderRoman() {
    const done    = escHtml(romanTarget.slice(0, romanIndex));
    const current = escHtml(romanTarget[romanIndex] || '');
    const pending = escHtml(romanTarget.slice(romanIndex + 1));
    romanDisplay.innerHTML =
      `<span class="roman-done">${done}</span>` +
      `<span class="roman-current">${current}</span>` +
      `<span class="roman-pending">${pending}</span>`;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
