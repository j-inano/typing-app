<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン - タイピングゲーム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1a1a2e; border-radius: 16px; padding: 40px; width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    h1 { color: #e0e0ff; text-align: center; margin-bottom: 8px; font-size: 1.6rem; }
    .sub { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 28px; }
    label { display: block; color: #aaa; font-size: 0.85rem; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 14px; background: #0f0f1a; border: 1px solid #333; border-radius: 8px; color: #e0e0ff; font-size: 1rem; margin-bottom: 18px; }
    input:focus { outline: none; border-color: #7c6af7; }
    button { width: 100%; padding: 12px; background: linear-gradient(135deg, #7c6af7, #5c4de0); color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .error { background: #3a1a1a; color: #ff6b6b; border-radius: 8px; padding: 10px 14px; margin-bottom: 18px; font-size: 0.88rem; }
    .link { text-align: center; margin-top: 18px; color: #888; font-size: 0.85rem; }
    .link a { color: #7c6af7; text-decoration: none; }
  </style>
</head>
<body>
<div class="card">
  <h1>⌨️ タイピングゲーム</h1>
  <p class="sub">ログインしてプレイ</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <label>ユーザー名</label>
    <input type="text" name="username" required autofocus>
    <label>パスワード</label>
    <input type="password" name="password" required>
    <button type="submit">ログイン</button>
  </form>
  <div class="link">アカウントがない方は <a href="/signup">新規登録</a></div>
</div>
</body>
</html>
